# TartanAir V2 native weather 평가(합성 아님 - 원본 안개/비/눈 환경).
#
# - GreatMarsh(안개)/Supermarket(비)/PolarSciFi(눈) x easy/hard, P000.
#   easy/hard는 난이도가 다른 별개 궤형 집합이지 clean/degraded 쌍이 아니다.
# - c0 = native weather 영상을 base StreamVGGT에 바로 투입(저하 측정).
#   c1은 없다(이미 날씨가 낀 입력에 합성을 겹치지 않는다).
# - c2 = ViWS-Net 날씨 제거 후 투입. 서버 스크립트가 native 프레임을
#   outputs/ext_v2_ta/degraded/native/<seq_id>/ 에 스테이징하면
#   restore_viws.py --variants native 가 restored/ 를 만든다.
# - stride는 각 궤적 길이에 맞춰 약 30프레임으로 조정(7-Scenes/NRGBD
#   프로토콜의 15~36프레임 범위와 정합).
# - VGGT-1B 사전학습에 TartanAir V1(18장면)이 포함 -> 논문에 공개.
#   단 V2 전용 장면 3종은 모델 계보에서 본 적 없는 환경이다.

experiment: ext_v2_ta

streamvggt:
  src_dir: ../../third_party/StreamVGGT/src
  weights: ../../third_party/StreamVGGT/ckpt/checkpoints.pth
  device: cuda
  size: 518
  crop: false
  # TartanAir V2는 640x640 정사각형. dust3r 계열 loader의 4:3 강제 가드가
  # square_ok=False면 float halfh를 만들어 resize가 죽는다(11c 확정).
  # square_ok=True는 VGGT demo 컨벤션(518x518)이며 GT aspect 1:1과 정합.
  square_ok: true

data:
  seven_scenes_root: ../../data/7scenes
  neural_rgbd_root: ../../data/neural_rgbd
  tartanair2_root: ../../data/tartanair2
  sequences:
    - id: ta_greatmarsh_easy_p000
      dataset: tartanair2
      env: GreatMarsh
      difficulty: easy
      traj: P000
      stride: 100         # 3537 frames -> 36
    - id: ta_greatmarsh_hard_p000
      dataset: tartanair2
      env: GreatMarsh
      difficulty: hard
      traj: P000
      stride: 60          # 1855 -> 31
    - id: ta_supermarket_easy_p000
      dataset: tartanair2
      env: Supermarket
      difficulty: easy
      traj: P000
      stride: 40          # 1155 -> 29
    - id: ta_supermarket_hard_p000
      dataset: tartanair2
      env: Supermarket
      difficulty: hard
      traj: P000
      stride: 20          # 635 -> 32
    - id: ta_polarscifi_easy_p000
      dataset: tartanair2
      env: PolarSciFi
      difficulty: easy
      traj: P000
      stride: 30          # 964 -> 33
    - id: ta_polarscifi_hard_p000
      dataset: tartanair2
      env: PolarSciFi
      difficulty: hard
      traj: P000
      stride: 18          # 583 -> 33

weather:
  # native 축은 합성을 쓰지 않는다. variants의 'native'는 run_infer c2의
  # 디렉터리 규격(restored/native/<seq_id>)을 위한 의사 variant다.
  variants: [native]
  seed: 0

cases: [c0, c2]
c2_input_dir: restored

eval:
  max_depth: 10.0
  align: scale&shift
  pose_align: sim3
  crop224: true
  icp_threshold: 0.1
  max_points: 500000
  use_gpu: true
